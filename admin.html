<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Certificados</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#2e86c9; --azul-esc:#1c2541; --dourado:#fbbf2f; --verde:#1f8a4c; --vermelho:#c0392b;
    --fundo:#eef2f8; --card:#fff; --texto:#1d2433; --suave:#5b6578; --borda:#d6deea;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--fundo);color:var(--texto)}
  header{background:var(--azul-esc);border-bottom:5px solid var(--dourado);color:#fff;padding:20px 16px 60px;text-align:center}
  header img{width:min(300px,80%);height:auto;display:block;margin:0 auto 10px}
  header h1{margin:0;font-family:"Playfair Display",serif;font-size:clamp(24px,5vw,32px)}
  main{max-width:760px;margin:-40px auto 40px;padding:0 16px}
  .card{background:var(--card);border-radius:16px;box-shadow:0 10px 30px rgba(28,37,65,.14);padding:26px;margin-bottom:18px}
  h2{margin:0 0 4px;font-size:20px}
  h3{margin:24px 0 10px;font-size:16px;color:var(--azul-esc)}
  .sub{margin:0 0 16px;color:var(--suave);font-size:14px}
  label.campo{display:block;font-weight:600;margin:14px 0 6px}
  input[type=text],input[type=password],textarea{width:100%;padding:12px 14px;font-size:16px;border:2px solid var(--borda);border-radius:10px;font-family:inherit}
  input:focus,textarea:focus{outline:none;border-color:var(--azul)}
  textarea{min-height:70px;resize:vertical;font-size:14px}
  button{font-family:inherit;font-size:16px;font-weight:600;border:0;border-radius:10px;padding:13px 20px;cursor:pointer}
  .btn{background:var(--azul);color:#fff;width:100%;margin-top:18px}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn-sec{background:#fff;color:var(--azul);border:2px solid var(--azul)}
  .linha{display:flex;gap:10px;align-items:flex-end}
  .linha > div{flex:1}
  .linha button{margin-top:0;width:auto}
  .msg{padding:12px 14px;border-radius:10px;margin-top:14px;font-size:14px;line-height:1.45}
  .msg.erro{background:#fdecea;color:var(--vermelho)}
  .msg.ok{background:#e7f6ee;color:var(--verde)}
  .msg.info{background:#eaf1fc;color:#1b5f95}
  .opcoes{display:grid;gap:8px}
  .op{display:flex;align-items:center;gap:12px;border:2px solid var(--borda);border-radius:10px;padding:12px 14px;cursor:pointer;font-weight:500}
  .op:has(input:checked){border-color:var(--azul);background:#eaf1fc}
  .op input{width:20px;height:20px;flex:none;accent-color:var(--azul)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--suave);padding:8px 6px;border-bottom:2px solid var(--borda)}
  th.c,td.c{text-align:center;width:84px}
  td{padding:9px 6px;border-bottom:1px solid var(--borda);vertical-align:top}
  td small{display:block;color:var(--suave);font-size:12px;margin-top:2px}
  td input{width:20px;height:20px;accent-color:var(--azul)}
  tr:has(input:checked){background:#f4f8fd}
  .resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
  .resumo div{background:#f4f8fd;border-radius:10px;padding:10px;text-align:center}
  .resumo b{display:block;font-size:22px;color:var(--azul-esc)}
  .resumo span{font-size:12px;color:var(--suave)}
  .oculto{display:none!important}
  .topo-admin{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .sair{background:none;color:var(--suave);padding:6px 0;font-size:14px;text-decoration:underline}
  @media (max-width:560px){ .card{padding:18px} th.c,td.c{width:62px} .linha{flex-direction:column;align-items:stretch} .linha button{width:100%} }
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="IV SETILSP 2026">
  <h1>Administração dos certificados</h1>
</header>

<main>
  <!-- LOGIN -->
  <section class="card" id="telaLogin">
    <h2>Entrar</h2>
    <p class="sub">Área restrita da organização.</p>
    <label class="campo" for="senha">Senha</label>
    <input type="password" id="senha" autocomplete="current-password">
    <button class="btn" id="btnEntrar">Entrar</button>
    <div id="msgLogin"></div>
  </section>

  <!-- CADASTRO -->
  <section id="telaAdmin" class="oculto">
    <div class="card">
      <div class="topo-admin"><h2>Resumo da planilha</h2><button class="sair" id="btnSair">Sair</button></div>
      <div class="resumo" id="resumo" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <h2>Cadastro</h2>
      <p class="sub">Digite o CPF e clique em Buscar. Se a pessoa já estiver na planilha, os dados aparecem para editar.</p>

      <div class="linha">
        <div>
          <label class="campo" for="cpf">CPF</label>
          <input type="text" id="cpf" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" autocomplete="off">
        </div>
        <button class="btn btn-sec" id="btnBuscar">Buscar</button>
      </div>
      <div id="msgBusca"></div>

      <div id="formulario" class="oculto">
        <label class="campo" for="nome">Nome completo</label>
        <input type="text" id="nome" placeholder="Nome como vai sair no certificado">

        <h3>Certificados</h3>
        <div class="opcoes">
          <label class="op"><input type="checkbox" id="monitor"> Monitor(a)</label>
          <label class="op"><input type="checkbox" id="presencial"> Participação presencial</label>
          <label class="op"><input type="checkbox" id="online"> Participação online</label>
        </div>

        <h3>Oficinas</h3>
        <table>
          <thead><tr><th>Oficina</th><th class="c">Participou</th><th class="c">Oficineiro(a)</th></tr></thead>
          <tbody id="tabOficinas"></tbody>
        </table>

        <label class="campo" for="obs">Observações (só para a organização)</label>
        <textarea id="obs"></textarea>

        <button class="btn" id="btnSalvar">Salvar</button>
        <div id="msgSalvar"></div>
      </div>
    </div>
  </section>
</main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwRpox2IZA5_JNwMVyhJEbCA0_698sQaVe85LP2qieccQPHCpkKLDyl42IajbSOKXhdyg/exec";

const OFICINAS = [
  { id:"O1",  data:"29 de julho de 2026", horario:"9h às 12h",  sala:"308", carga:3,
    titulo:"TIALS na prática: Elementos básicos para Tradução Audiovisual em Libras",
    oficineiros:["Raphael Castelo Branco","Lenildo Souza"], mediacao:"Ana Flores" },
  { id:"O2",  data:"29 de julho de 2026", horario:"9h às 12h",  sala:"313", carga:3,
    titulo:"Língua de sinais como cena, corpo e autoria",
    oficineiros:["Edécio Ambrósio"], mediacao:"Érica Silva" },
  { id:"O3",  data:"29 de julho de 2026", horario:"14h às 17h", sala:"308", carga:3,
    titulo:"Práticas de tradução e interpretação no contexto multidisciplinar em Saúde",
    oficineiros:["Emanuela Araújo","Ana Regina Campelo","Ricardo Boaretto"], mediacao:"Rose Fonseca" },
  { id:"O4",  data:"29 de julho de 2026", horario:"14h às 17h", sala:"313", carga:3,
    titulo:"Interpretação voz: Estratégias de preparação e atuação",
    oficineiros:["Felipe Brum","Suzana Alves"], mediacao:"Sara Rodrigues" },
  { id:"O5",  data:"29 de julho de 2026", horario:"14h às 17h", sala:"314", carga:3,
    titulo:"Interpretação em contexto midiático",
    oficineiros:["Alessandra Scarpin","Mateus Delmar"], mediacao:"Ana Paula Tostis" },
  { id:"O6",  data:"30 de julho de 2026", horario:"9h às 12h",  sala:"314", carga:3,
    titulo:"Guiainterpretação: Fundamentos e Práticas Profissionais",
    oficineiros:["Eli Silva","Indira Cardoso","Karine Rocha","Paola Mota"], mediacao:"Lorena Sousa" },
  { id:"O7",  data:"30 de julho de 2026", horario:"9h às 12h",  sala:"313", carga:3,
    titulo:"Gramática e tradução: por que não?",
    oficineiros:["Isaac Gomes"], mediacao:"Natállia Maia" },
  { id:"O8",  data:"30 de julho de 2026", horario:"9h às 12h",  sala:"308", carga:3,
    titulo:"PIT (Plano individualizado do TILSP)",
    oficineiros:["Vanessa Bartolo"], mediacao:"Noely Silveira" },
  { id:"O9",  data:"30 de julho de 2026", horario:"17h às 20h", sala:"314", carga:3,
    titulo:"Acessibilidade Artística e Interpretação em Libras: Experiências de Duas Intérpretes Negras",
    oficineiros:["Sheila Martins","Suanne Gonçalves"], mediacao:"Marcos Soares" },
  { id:"O10", data:"30 de julho de 2026", horario:"17h às 20h", sala:"313", carga:3,
    titulo:"A Atuação do Intérprete Surdo: Práticas, Desafios e Possibilidades",
    oficineiros:["Ricardo Boaretto"], mediacao:"Daniel Lemos" },
  { id:"O11", data:"30 de julho de 2026", horario:"17h às 20h", sala:"308", carga:3,
    titulo:"Tradução e interpretação educacional: produção de materiais bilíngues",
    oficineiros:["Renata Costa","Laura Jane Messias"], mediacao:"Amaury Messias" }
];


const $ = id => document.getElementById(id);
let senha = "";
try { senha = sessionStorage.getItem("admSenha") || ""; } catch (e) {}

function soDigitos(v){ return (v || "").replace(/\D/g, ""); }
function mascaraCpf(v){
  v = soDigitos(v).slice(0, 11);
  return v.replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d{1,2})$/, "$1-$2");
}
function cpfValido(cpf){
  cpf = soDigitos(cpf);
  if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
  for (let t = 9; t < 11; t++){
    let s = 0;
    for (let i = 0; i < t; i++) s += cpf[i] * (t + 1 - i);
    if (((s * 10) % 11) % 10 != cpf[t]) return false;
  }
  return true;
}
function formatarNome(n){
  const minusc = ["da","de","do","das","dos","e","di","du"];
  return n.trim().replace(/\s+/g, " ").toLowerCase().split(" ").map((p, i) =>
    (i > 0 && minusc.includes(p)) ? p : p.charAt(0).toUpperCase() + p.slice(1)).join(" ");
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function mensagem(el, tipo, txt){ $(el).innerHTML = txt ? `<div class="msg ${tipo}">${txt}</div>` : ""; }

async function api(dados){
  const r = await fetch(API_URL, { method: "POST", body: JSON.stringify({ ...dados, senha }) });
  return r.json();
}

/* ---------- tabela de oficinas ---------- */
$("tabOficinas").innerHTML = OFICINAS.map(o => `
  <tr>
    <td><b>${o.id}</b> · ${esc(o.titulo)}<small>${o.data.replace(" de 2026","")}, ${o.horario} · sala ${o.sala}</small></td>
    <td class="c"><input type="checkbox" data-part="${o.id}" aria-label="Participou da ${o.id}"></td>
    <td class="c"><input type="checkbox" data-min="${o.id}" aria-label="Oficineiro da ${o.id}"></td>
  </tr>`).join("");

/* ---------- login ---------- */
async function entrar(){
  $("btnEntrar").disabled = true; mensagem("msgLogin");
  try {
    const r = await api({ acao: "admin_login" });
    if (!r.ok){ senha = ""; try { sessionStorage.removeItem("admSenha"); } catch (e) {} ; return mensagem("msgLogin", "erro", r.erro); }
    try { sessionStorage.setItem("admSenha", senha); } catch (e) {}
    $("telaLogin").classList.add("oculto"); $("telaAdmin").classList.remove("oculto");
    carregarResumo(); $("cpf").focus();
  } catch (e) {
    mensagem("msgLogin", "erro", "Não foi possível conectar. Tente de novo.");
  } finally { $("btnEntrar").disabled = false; }
}
$("btnEntrar").onclick = () => { senha = $("senha").value; entrar(); };
$("senha").addEventListener("keydown", e => { if (e.key === "Enter") $("btnEntrar").click(); });
$("btnSair").onclick = () => { try { sessionStorage.removeItem("admSenha"); } catch (e) {} location.reload(); };
if (senha) entrar();

async function carregarResumo(){
  try {
    const r = await api({ acao: "admin_resumo" });
    if (!r.ok) return;
    const c = r.resumo;
    $("resumo").innerHTML = [
      ["Com CPF", c.total], ["Presencial", c.presencial], ["Online", c.online], ["Monitores", c.monitor],
      ["Oficineiros", c.oficineiro], ["Com oficina", c.oficina], ["Já baixaram", c.nomePreenchido]
    ].map(([t, n]) => `<div><b>${n}</b><span>${t}</span></div>`).join("");
  } catch (e) {}
}

/* ---------- buscar / preencher ---------- */
$("cpf").addEventListener("input", e => { e.target.value = mascaraCpf(e.target.value); $("formulario").classList.add("oculto"); mensagem("msgBusca"); mensagem("msgSalvar"); });
$("cpf").addEventListener("keydown", e => { if (e.key === "Enter") $("btnBuscar").click(); });

function preencher(d){
  $("nome").value = d.nome || "";
  $("monitor").checked = !!d.monitor;
  $("presencial").checked = !!d.presencial;
  $("online").checked = !!d.online;
  $("obs").value = d.observacoes || "";
  document.querySelectorAll("[data-part]").forEach(i => i.checked = (d.oficinas || []).includes(i.dataset.part));
  document.querySelectorAll("[data-min]").forEach(i => i.checked = (d.ministrou || []).includes(i.dataset.min));
}

$("btnBuscar").onclick = async () => {
  const cpf = soDigitos($("cpf").value);
  if (!cpfValido(cpf)) return mensagem("msgBusca", "erro", "CPF inválido. Confira os números.");
  $("btnBuscar").disabled = true; mensagem("msgSalvar");
  try {
    const r = await api({ acao: "admin_buscar", cpf });
    if (!r.ok) return mensagem("msgBusca", "erro", r.erro);
    preencher(r.existe ? r : {});
    mensagem("msgBusca", "info", r.existe
      ? `CPF já cadastrado (linha ${r.linha} da planilha). Edite e clique em Salvar.` + (r.nomeTravado ? "<br>O participante já preencheu o nome. Se você alterar aqui, vale o seu." : "")
      : "CPF novo. Preencha os dados e clique em Salvar.");
    $("formulario").classList.remove("oculto");
    $("nome").focus();
  } catch (e) {
    mensagem("msgBusca", "erro", "Não foi possível consultar. Tente de novo.");
  } finally { $("btnBuscar").disabled = false; }
};

/* ---------- salvar ---------- */
$("btnSalvar").onclick = async () => {
  const cpf = soDigitos($("cpf").value);
  const nome = formatarNome($("nome").value);
  const oficinas = [...document.querySelectorAll("[data-part]:checked")].map(i => i.dataset.part);
  const ministrou = [...document.querySelectorAll("[data-min]:checked")].map(i => i.dataset.min);
  const dados = { acao: "admin_salvar", cpf, nome, oficinas, ministrou,
    monitor: $("monitor").checked, presencial: $("presencial").checked, online: $("online").checked,
    observacoes: $("obs").value.trim() };

  if (!cpfValido(cpf)) return mensagem("msgSalvar", "erro", "CPF inválido.");
  if (nome.split(" ").filter(p => p.length > 1).length < 2) return mensagem("msgSalvar", "erro", "Escreva o nome completo.");
  if (!dados.monitor && !dados.presencial && !dados.online && !oficinas.length && !ministrou.length)
    return mensagem("msgSalvar", "erro", "Marque pelo menos um certificado.");
  const ambos = oficinas.filter(o => ministrou.includes(o));
  if (ambos.length) return mensagem("msgSalvar", "erro", `Na ${ambos.join(", ")} marque só Participou ou só Oficineiro(a), não os dois.`);

  $("btnSalvar").disabled = true; $("btnSalvar").textContent = "Salvando...";
  try {
    const r = await api(dados);
    if (!r.ok) return mensagem("msgSalvar", "erro", r.erro);
    $("nome").value = nome;
    mensagem("msgSalvar", "ok", (r.novo ? "Cadastrado" : "Atualizado") + ` com sucesso (linha ${r.linha}). A pessoa já pode baixar em <b>gabrieldeaf.github.io/certificados-setilsp</b>.`);
    carregarResumo();
  } catch (e) {
    mensagem("msgSalvar", "erro", "Não foi possível salvar. Tente de novo.");
  } finally { $("btnSalvar").disabled = false; $("btnSalvar").textContent = "Salvar"; }
};
</script>
</body>
</html>
